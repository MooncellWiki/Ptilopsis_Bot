[project]
name = "ptilopsis-bot"
version = "0.1.0"
description = "PRTS wiki bot"
requires-python = ">=3.13, <4.0"
dependencies = [
    "requests (>=2.32.0,<3.0.0)",
    "retrying (>=1.3.3,<2.0.0)",
    "sentry-sdk (>=1.45.0,<3.0.0)",
    "pytz (>=2016.10)",
]

[dependency-groups]
dev = ["ruff>=0.15.0,<1"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F",
    "W",
    "E",
    "I",
    "UP",
    "ASYNC",
    "C4",
    "T10",
    "T20",
    "PYI",
    "Q",
    "TC",
    "TID",
    "DTZ",
    "RUF",
]
ignore = [
    "E402",
    "UP037",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["utils", "jobs"]

[tool.ruff.lint.extend-per-file-ignores]
"./jobs/*" = ["T201"]
"./main.py" = ["T201"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.hatch.build.targets.wheel]
packages = ["utils", "jobs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
