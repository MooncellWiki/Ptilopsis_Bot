name: main-jp

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      # --remote 结束后 git push 更新 version_remote.json
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Setup Python environment
      uses: ./.github/actions/setup-python

    - name: update-jp
      env:
        PTILOPSIS_USERNAME: ${{ secrets.PTILOPSIS_USERNAME }}
        PTILOPSIS_PASSWORD: ${{ secrets.PTILOPSIS_PASSWORD }}
        PTILOPSIS_SENTRY_DSN: ${{ secrets.PTILOPSIS_SENTRY_DSN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        uv run ptil --check-jp --remote jp
